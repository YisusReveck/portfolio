<section class="container grid" id="hero">
  <div class="left col-4 col-md-6 col-lg-6">
    <p class="display-lg typewriter" [textContent]="typewriter.visibleText()"></p>
    <h1 class="title">{{ i18n.translations().hero.title }}</h1>
    <p class="description">{{ i18n.translations().hero.description }}</p>
    <div class="links col-4 col-md-6 col-lg-12">
      <a
        class="cv-button"
        [href]="'own/' + i18n.translations().cv.file"
        download
        target="_blank"
        rel="noopener"
        >{{ i18n.translations().cv.text }}</a
      >
      <app-tooltip text="Linkedin" placement="top">
        <a href="https://www.linkedin.com/in/jesusm147/" target="_blank" rel="noopener noreferrer">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="lucide lucide-linkedin"
          >
            <path
              d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z"
            ></path>
            <rect width="4" height="12" x="2" y="9"></rect>
            <circle cx="4" cy="4" r="2"></circle>
          </svg>
          <!-- <span>Linkedin</span> -->
        </a>
      </app-tooltip>
      <app-tooltip text="GitHub" placement="top">
        <a href="https://github.com/YisusReveck" target="_blank" rel="noopener noreferrer">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="lucide lucide-github"
          >
            <path
              d="M15 22v-4a4.8 4.8 0 0 0-1-3.5c3 0 6-2 6-5.5.08-1.25-.27-2.48-1-3.5.28-1.15.28-2.35 0-3.5 0 0-1 0-3 1.5-2.64-.5-5.36-.5-8 0C6 2 5 2 5 2c-.3 1.15-.3 2.35 0 3.5A5.403 5.403 0 0 0 4 9c0 3.5 3 5.5 6 5.5-.39.49-.68 1.05-.85 1.65-.17.6-.22 1.23-.15 1.85v4"
            ></path>
            <path d="M9 18c-4.51 2-5-2-7-2"></path>
          </svg>
          <!-- <span>GitHub</span> -->
        </a>
      </app-tooltip>
      <app-tooltip [text]="i18n.translations().hero.email" placement="top">
        <a href="mailto:miranda.jfmo@gmail.com">
          <svg
            id="svg-email"
            xmlns="http://www.w3.org/2000/svg"
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="lucide lucide-mail"
          >
            <rect width="20" height="16" x="2" y="4" rx="2"></rect>
            <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"></path>
          </svg>
          <!-- <span>miranda.jfmo@gmail.com</span> -->
        </a>
      </app-tooltip>
    </div>
  </div>
  <div class="right col-4 col-md-6 col-lg-6">
    <div
      id="photo_me"
      class="polaroid"
      [class.active]="activePhoto() === 'me'"
      (mouseenter)="changeActivePhoto('me')"
    >
      <img src="own/YISUS.jpg" alt="A photo of me" />
      <span class="polaroid__caption">{{ i18n.translations().hero.polaroid }}</span>
    </div>

    <div
      id="photo_cat"
      class="polaroid"
      [class.active]="activePhoto() === 'cat'"
      (mouseenter)="changeActivePhoto('cat')"
    >
      <img src="own/michi.jpeg" alt="A photo of my cat" />
      <span class="polaroid__caption"> Michi ~ </span>
    </div>
  </div>
  <div class="palabras_japonesas_1">
    <p>ヘスス</p>
    <p>ミランダ</p>
  </div>
  <div class="palabras_japonesas_2">
    <p>ミチ</p>
  </div>
</section>
